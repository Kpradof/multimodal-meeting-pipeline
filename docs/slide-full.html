<style>

  body {
    width: 1600px;
    height: 872px;
    background: #0F1319;

  svg { display: block; width: 100%; height: auto; margin-top: 22px; }

<div class="slide">

  <div class="top">
    <div>
      <h1>The record, and what it catches</h1>
      <p class="sub">
        Three channels of one meeting go into a single table. Notes written by a
        notetaker are then checked, claim by claim, against that table.
      </p>
    </div>
    <div class="badge">runs locally<br>no paid account</div>
  </div>

  <svg viewBox="0 0 1456 600" role="img"
       aria-label="Audio, documents and whiteboard frames become text and are stored in one table. Separately, notes written by a notetaker are broken into eleven checkable claims and searched against that same table, returning eight supported, one contradicted and two with no evidence. The contradicted claim states a profit aim of fifteen million euro where the projected slide reads fifty million euro.">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#A5AEBC"/>
      </marker>
      <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#E0A167"/>
      </marker>
    </defs>

    <!-- ============ BAND 1: build the record ============ -->
    <text x="0" y="16" font-family="IBM Plex Mono, monospace" font-size="14"
          letter-spacing="1.6" fill="#6F7887">BUILD THE RECORD</text>
    <line x1="0" y1="32" x2="1456" y2="32" stroke="#2A3039" stroke-width="1.5"/>

    <g font-size="19" font-weight="600" fill="#E9ECF2">
      <rect x="0" y="56" width="196" height="58" rx="4" fill="#1A1F28" stroke="#2A3039" stroke-width="1.5"/>
      <text x="20" y="83">Audio</text>
      <text x="176" y="83" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#8B99F5" text-anchor="end">237</text>
      <text x="20" y="103" font-size="13" font-weight="400" font-family="IBM Plex Mono, monospace" fill="#6F7887">4 meetings, 133 min</text>

      <rect x="0" y="126" width="196" height="58" rx="4" fill="#1A1F28" stroke="#2A3039" stroke-width="1.5"/>
      <text x="20" y="153">Documents</text>
      <text x="176" y="153" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#8B99F5" text-anchor="end">322</text>
      <text x="20" y="173" font-size="13" font-weight="400" font-family="IBM Plex Mono, monospace" fill="#6F7887">decks and minutes</text>

      <rect x="0" y="196" width="196" height="58" rx="4" fill="#1A1F28" stroke="#2A3039" stroke-width="1.5"/>
      <text x="20" y="223">Whiteboard</text>
      <text x="176" y="223" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#8B99F5" text-anchor="end">15</text>
      <text x="20" y="243" font-size="13" font-weight="400" font-family="IBM Plex Mono, monospace" fill="#6F7887">sampled frames</text>
    </g>

    <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#8B99F5" text-anchor="middle">
      <text x="252" y="80">ASR</text>
      <text x="252" y="150">PARSE</text>
      <text x="252" y="220">VLM</text>
    </g>
    <g stroke="#A5AEBC" stroke-width="1.8" fill="none">
      <line x1="196" y1="90" x2="308" y2="90" marker-end="url(#a)"/>
      <line x1="196" y1="160" x2="308" y2="160" marker-end="url(#a)"/>
      <line x1="196" y1="230" x2="308" y2="230" marker-end="url(#a)"/>
    </g>

    <g stroke="#A5AEBC" stroke-width="1.8" fill="none">
      <path d="M 308 90 L 452 90 L 452 160"/>
      <path d="M 308 230 L 452 230 L 452 160"/>
      <line x1="308" y1="160" x2="452" y2="160"/>
      <line x1="452" y1="160" x2="612" y2="160" marker-end="url(#a)"/>
    </g>
    <text x="532" y="150" font-family="IBM Plex Mono, monospace" font-size="13"
          fill="#6F7887" text-anchor="middle">embed</text>

    <!-- ============ THE TABLE, the hinge ============ -->
    <rect x="612" y="60" width="212" height="380" rx="5" fill="#1B2140" stroke="#8B99F5" stroke-width="2.2"/>
    <text x="718" y="222" font-size="24" font-weight="600" fill="#E9ECF2" text-anchor="middle">One table</text>
    <text x="718" y="250" font-size="17" fill="#A5AEBC" text-anchor="middle">all three channels</text>
    <text x="718" y="286" font-family="IBM Plex Mono, monospace" font-size="15" fill="#8B99F5" text-anchor="middle">768 dimensions</text>
    <text x="718" y="310" font-family="IBM Plex Mono, monospace" font-size="15" fill="#8B99F5" text-anchor="middle">574 chunks</text>

    <!-- ============ BAND 2: audit against it ============ -->
    <text x="0" y="322" font-family="IBM Plex Mono, monospace" font-size="14"
          letter-spacing="1.6" fill="#6F7887">AUDIT AGAINST IT</text>
    <line x1="0" y1="338" x2="580" y2="338" stroke="#2A3039" stroke-width="1.5"/>

    <rect x="0" y="362" width="230" height="86" rx="4" fill="#1A1F28" stroke="#2A3039" stroke-width="1.5"/>
    <text x="20" y="394" font-size="19" font-weight="600" fill="#E9ECF2">Notes</text>
    <text x="20" y="416" font-size="15" fill="#A5AEBC">a notetaker, or a person</text>
    <text x="20" y="437" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6F7887">tested on both</text>

    <line x1="230" y1="405" x2="306" y2="405" stroke="#A5AEBC" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="268" y="393" font-family="IBM Plex Mono, monospace" font-size="13" fill="#8B99F5" text-anchor="middle">EXTRACT</text>

    <rect x="306" y="362" width="164" height="86" rx="4" fill="#161B23" stroke="#2A3039" stroke-width="1.5"/>
    <text x="388" y="404" font-size="34" font-weight="700" fill="#8B99F5" text-anchor="middle">11</text>
    <text x="388" y="430" font-size="15" fill="#A5AEBC" text-anchor="middle">checkable claims</text>

    <g stroke="#A5AEBC" stroke-width="1.8" fill="none">
      <path d="M 470 405 L 545 405 L 545 340"/>
      <line x1="545" y1="340" x2="612" y2="340" marker-end="url(#a)"/>
    </g>
    <text x="578" y="328" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6F7887" text-anchor="middle">cosine</text>

    <!-- ============ verdicts ============ -->
    <line x1="824" y1="250" x2="888" y2="250" stroke="#A5AEBC" stroke-width="1.8" marker-end="url(#a)"/>

    <rect x="888" y="132" width="176" height="72" rx="4" fill="#161B23" stroke="#2A3039" stroke-width="1.5"/>
    <text x="910" y="168" font-size="27" font-weight="700" fill="#6FBF92">8</text>
    <text x="950" y="168" font-size="16" fill="#E9ECF2">supported</text>
    <text x="910" y="190" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#6F7887">record agrees</text>

    <rect x="888" y="214" width="176" height="72" rx="4" fill="#2E2317" stroke="#E0A167" stroke-width="2"/>
    <text x="910" y="250" font-size="27" font-weight="700" fill="#E0A167">1</text>
    <text x="950" y="250" font-size="16" fill="#E9ECF2">contradicted</text>
    <text x="910" y="272" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#E0A167">record disagrees</text>

    <rect x="888" y="296" width="176" height="72" rx="4" fill="#161B23" stroke="#2A3039" stroke-width="1.5"/>
    <text x="910" y="332" font-size="27" font-weight="700" fill="#6F7887">2</text>
    <text x="950" y="332" font-size="16" fill="#E9ECF2">no evidence</text>
    <text x="910" y="354" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#6F7887">search found none</text>

    <line x1="1064" y1="250" x2="1124" y2="250" stroke="#E0A167" stroke-width="2" marker-end="url(#f)"/>

    <rect x="1124" y="146" width="332" height="208" rx="5" fill="#161B23" stroke="#E0A167" stroke-width="2"/>
    <text x="1148" y="182" font-family="IBM Plex Mono, monospace" font-size="13" fill="#E0A167" letter-spacing="1.2">THE FLAGGED CLAIM</text>
    <line x1="1148" y1="196" x2="1432" y2="196" stroke="#2A3039" stroke-width="1.5"/>
    <text x="1148" y="222" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#6F7887">notes say</text>
    <text x="1148" y="245" font-size="17" fill="#E9ECF2">profit aim: fifteen million</text>
    <text x="1148" y="281" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#6F7887">the projected slide reads</text>
    <text x="1148" y="304" font-size="17" font-weight="600" fill="#E0A167">Profit aim: 50 M euro</text>
    <text x="1148" y="336" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#6F7887">so do the minutes written after</text>

    <text x="0" y="510" font-size="17" fill="#A5AEBC">Run on notes a model wrote from the audio alone, it flags the same figure: 1,250 euro for a cost the deck puts at 12.50.</text>
    <text x="0" y="540" font-size="17" fill="#6F7887">The human notes shown here are AMI's own, used as ground truth in meeting summarization research.</text>
  </svg>
